services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: Host=db;Port=5432;Database=school_admission;Username=school_user;Password=${POSTGRES_PASSWORD:-local_dev_password}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      ASPNETCORE_URLS: http://0.0.0.0:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
